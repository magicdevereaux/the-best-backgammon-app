name: CI

# Runs all three test suites, plus Django's deployment check and the web
# production build. Each suite is its own job so a red X points at the guilty
# client (backend / web / mobile) without reading logs.
#
# Baselines as of 2026-08-01: backend 421, web 243, mobile 125 (789 total).

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch/PR cancels the previous, still-running run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the local dev venv (backend/venv, CPython 3.11.9).
        # Django 4.2 supports 3.8-3.12, so widen this list if you want more.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # requirements.txt is pinned. psycopg2-binary ships manylinux wheels, so
        # no apt packages (libpq-dev / build-essential) are needed on
        # ubuntu-latest -- if that ever changes, add an apt-get step here.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        # Tests use an in-memory SQLite DB; no service container required.
        # Django runs its system checks as part of `test`, so a separate
        # `manage.py check` would be redundant.
        run: python manage.py test game --verbosity 2

      - name: Django deployment checks
        working-directory: backend
        # The production hardening in settings.py is gated on DEBUG, so this
        # only exercises anything with DEBUG=False. The env var contract is
        # backend/.env.example; the SECRET_KEY is generated per-run and thrown
        # away (a missing one raises ImproperlyConfigured when DEBUG=False).
        # --fail-level WARNING is load-bearing: --deploy reports W0xx warnings
        # and would otherwise exit 0 with the findings buried in the log.
        # Expect "System check identified no issues" -- if it ever doesn't,
        # fix the setting, don't relax the fail level.
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: example.com

  web:
    name: Web (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        # Create React App: the Babel/jest transform only exists inside
        # `react-scripts test`. Bare `npx jest` here fails EVERY suite with
        # "SyntaxError: Cannot use import statement outside a module" and runs
        # zero tests. Do not "simplify" this line.
        # Expect harmless React Router v7 future-flag deprecation warnings.
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Production build
        working-directory: frontend
        # CRA's production build is stricter than its test transform, so a
        # build-only breakage (unused import, bad env reference) is invisible to
        # `npm test` and would otherwise surface at deploy time. Under CI=true
        # react-scripts treats build warnings as errors -- that is the point of
        # this step, so fix the warning rather than unsetting CI.
        # REACT_APP_API_BASE_URL is deliberately unset: the client falls back to
        # its dev host resolution, and this step is checking compilation only.
        run: npm run build
        env:
          CI: true

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run tests
        working-directory: mobile
        # Unlike frontend/, this project uses the jest-expo preset directly, so
        # bare `npx jest` IS the correct invocation.
        run: npx jest
        env:
          CI: true
